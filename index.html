<style>

.main{border-left:3px solid var(--hu);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}

.actors{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.actors .d{grid-column:2;font-size:15px;color:var(--muted)}
.prod{font-size:20px;line-height:1.4}
.name{display:none}
.reveal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:420px){.name{display:none}
.reveal{grid-template-columns:1fr}}
.tag{width:120px;height:142px;background:var(--tag);color:var(--tag-ink);border-radius:46% 46% 10px 10px / 34% 34% 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:16px;position:relative;font-family:var(--px)}
.tag::before{content:"";position:absolute;top:16px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--bg)}
.tag .cc{font-size:12px;font-weight:600}.tag .num{font-size:22px;font-weight:700;line-height:1.1}.tag .num2{font-size:16px;font-weight:600}
.facts{display:flex;flex-direction:column;gap:6px;min-width:0}
.sp{font-family:var(--px);font-size:26px;font-weight:700;line-height:1.15}
.name{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:2px solid var(--line);padding:14px}

.big{font-family:var(--px);font-weight:700;font-size:clamp(56px,18vw,100px);line-height:1;letter-spacing:-.02em}
.stat{border-left:4px solid var(--tag);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.rare{font-family:var(--px);font-size:13px;font-weight:600;background:var(--tag);color:var(--tag-ink);border-radius:20px;padding:4px 12px;align-self:flex-start}
.par{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:2px solid var(--line)}

.par li span:last-child{font-family:var(--px);font-size:13px;color:var(--muted);white-space:nowrap;align-self:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;color:var(--fg)}
.cell .dot{width:10px;height:10px;border-radius:50%}

button.cell:hover{border-color:var(--muted)}

.gestes{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:18px}
.gestes li::marker{color:var(--tag);font-family:var(--px);font-weight:700}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.srcs li{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);padding-bottom:10px}
.srcs a{color:var(--fg);font-family:var(--px);font-weight:600}
.card-img{width:100%;max-width:360px;border-radius:10px;display:block}

<script>
/* =================== RÉGLAGES =================== */
const CATS={
 terre:{nom:"Élevage terrestre",def:1,col:"#f2c230"},
 labo:{nom:"Laboratoire et fourrure",def:1,col:"#c9a26a"},
 eau:{nom:"Poissons et crustacés",def:0,col:"#4f8fa8"},
 insecte:{nom:"Insectes",def:0,col:"#8a9a4a"},
 compagnie:{nom:"Animaux de compagnie",def:1,col:"#b07ac0"},
 nac:{nom:"NAC et animaux exotiques",def:1,col:"#d08aa0"},
 spectacle:{nom:"Spectacle et loisirs",def:1,col:"#c8574c"},
 sauvage:{nom:"Animaux sauvages",def:1,col:"#5aa06a"},
};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const defCats=Object.fromEntries(Object.entries(CATS).map(([k,v])=>[k,!!v.def]));
let OPT=LS.get("ism80_opt5",{cats:defCats,mode:"jeu"});
OPT.cats={...defCats,...OPT.cats};
const ANIMALS=()=>Object.keys(LIVES).filter(k=>!LIVES[k].human);
const HUMANS=()=>Object.keys(LIVES).filter(k=>LIVES[k].human);
const pool=()=>ANIMALS().filter(k=>OPT.cats[LIVES[k].cat]);
/* poids : réel brut, ou « jeu » = réel adouci + anti-répétition par famille */
const HIST=()=>LS.get("ism80_hist",[]);
function wReal(k){return LIVES[k].poids}
function wGame(k,hist){let w=Math.pow(LIVES[k].poids,.45);if(hist){const f=fam(k);const n=hist.slice(-5).filter(x=>x===f).length;w*=Math.pow(.22,n);if(hist[hist.length-1]===f)w*=.08}return w}
function wMode(k,hist){if(OPT.mode==="brut")return wReal(k);if(OPT.mode==="hasard")return hist&&hist[hist.length-1]===fam(k)?.15:1;return wGame(k,hist)}
function share(fn){const P=pool();const T=P.reduce((a,k)=>a+fn(k),0)||1;return k=>fn(k)/T*100}
function fmtPct(v){if(v>=10)return Math.round(v)+" %";if(v>=1)return v.toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";if(v>=.01)return v.toLocaleString("fr-FR",{maximumFractionDigits:2})+" %";if(v<=0)return "0 %";return "< 0,01 %"}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function pick(P,w){const T=P.reduce((a,k)=>a+w(k),0);let r=Math.random()*T;for(const k of P){r-=w(k);if(r<0)return k}return P[P.length-1]}
function drawLife(){const h=HIST();const P=pool();return pick(P.length?P:["poulet"],k=>wMode(k,h))}
function drawReal(){const P=ANIMALS().filter(k=>!LIVES[k].sym);return pick(P,wReal)}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app");

/* =================== TEMPS =================== */
function age(d){if(d<1)return "Heure "+Math.max(1,Math.round(d*24));if(d<28)return "Jour "+Math.round(d);if(d<120)return "Semaine "+Math.round(d/7);if(d<730)return "Mois "+Math.round(d/30.4);return "An "+Math.round(d/365)}
function dur(d){if(d<1)return {n:"<1",u:"jour",t:"quelques heures"};
  if(d<60){const n=Math.round(d);return {n,u:n>1?"jours":"jour",t:n+(n>1?" jours":" jour")}}
  if(d<730){const n=Math.round(d/30.4);return {n,u:"mois",t:n+" mois"}}
  const n=Math.round(d/365);return {n,u:"ans",t:n+" ans"}}
function clock(sec){const m=Math.floor(sec/60),s=sec%60;return m?`${m} min ${String(s).padStart(2,"0")} s`:`${s} s`}

/* =================== ÉTAT =================== */
let S=null,T0=0,KEY=null;
function newState(k){
  const L=LIVES[k];const picks={};const lieu0=rnd(L.lieux);const m0=Math.random()<.5;
  L.ev.forEach((e,j)=>{if(e.alt){const ok=e.alt.map((a,i)=>i).filter(i=>!e.alt[i].when||e.alt[i].when({lieu:lieu0,m:m0,f:{}}));picks[j]=ok.length?ok[Math.floor(Math.random()*ok.length)]:0}});
  const plan=L.ev.map((_,j)=>({m:j}));
  if(!L.human){const n=DEPTH[k]!=null?DEPTH[k]:5;const gaps=Math.max(1,L.ev.length-1);const cnt=Array(gaps).fill(0);for(let i=0;i<n;i++)cnt[Math.floor(Math.random()*gaps)]++;
    const out=[];plan.forEach((p,j)=>{out.push(p);if(j<gaps)for(let i=0;i<cnt[j];i++)out.push({i:1})});plan.length=0;plan.push(...out)}
  return {k,env:ENV[k]||"bat",lieu:lieu0,pi:0,plan,queue:[],used:[],s:L.human?5:8,p:L.human?5:2,f:{},m:m0,picks,hist:[],el:0,d:0,
    tag:String(Math.floor(Math.random()*9e8+1e8)),mort:null,res:null,cur:null,comp:null,rare:false}}
function evAt(j){const e=LIVES[S.k].ev[j];return e.alt?e.alt[S.picks[j]]:e}
function rawD(j){const e=LIVES[S.k].ev[j];return (e.alt?e.alt[0]:e).d}
function save(){if(!S)return;LS.set("ism80_save4",{...S,el:S.el+(T0?Date.now()-T0:0)})}
window.addEventListener("pagehide",()=>{if(S&&T0)save()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S&&T0)save()});
const sub=t=>String(t||"").replaceAll("{C}",S&&S.comp?S.comp.nom:"l'autre");
function compAnimal(){return S.comp&&!S.comp.h&&(S.comp.st==="ok"||S.comp.st==="sick")}
function compHuman(){return S.comp&&S.comp.h&&S.comp.st==="ok"}
function needOK(n){if(!n)return true;if(n==="comp")return compAnimal();if(n==="sick")return S.comp&&!S.comp.h&&S.comp.st==="sick";if(n==="hcomp")return compHuman();return true}
function curEv(){const c=S.cur;if(!c)return null;
  if(c.t==="m")return evAt(c.j);
  if(c.t==="i"){const I=INTER.find(x=>x.id===c.id);return {...I,d:c.d,alea:1}}
  if(c.t==="a"){return {...ARCS[c.arc][c.idx],d:c.d,alea:1}}
  if(c.t==="r"){const R0=rareFor(S.k);return {...R0,d:c.d,end:1,rare:1}}}
function choicesOf(e){return (e.c||[]).filter(o=>needOK(o.need))}

/* =================== ACCUEIL =================== */
function intro(){
  KEY=null;const sv=LS.get("ism80_save4",null);const valid=sv&&LIVES[sv.k];
  const P=pool();const real=share(wReal),game=share(k=>wMode(k,null));
  const catTot={};Object.keys(CATS).forEach(c=>catTot[c]=P.filter(k=>LIVES[k].cat===c).reduce((a,k)=>a+game(k),0));
  const catReal={};Object.keys(CATS).forEach(c=>catReal[c]=P.filter(k=>LIVES[k].cat===c).reduce((a,k)=>a+real(k),0));
  const nb=ANIMALS().length;
  app.innerHTML=`
  <div class="label"><b>80 milliards</b> · Une vie tirée au sort</div>
  <canvas class="scene" id="cv" width="${W}" height="${H}" role="img" aria-label="Un hangar rempli de poulets"></canvas>
  <h1>Chaque année, plus de 80 milliards d'animaux terrestres sont élevés puis abattus. Tu vas naître.</h1>
  <p class="lede">Tu ne choisis ni ton espèce, ni ton pays. Ta vie avance, entre ce qui arrive vraiment et ce que le hasard te réserve.</p>
  <p class="small">Conseillé à partir de 12 ans. Le jeu parle de la vie et de la mort des animaux, avec des mots simples et sans images violentes.</p>
  <div class="row">${valid?`<button class="btn" id="resume">Reprendre : ${esc(LIVES[sv.k].nom)}</button><button class="btn ghost" id="go">Naître à nouveau</button>`:`<button class="btn" id="go">Naître</button>`}</div>
  <div class="row"><button class="btn ghost" id="wild">Mode Vies sauvages</button><button class="btn ghost" id="hum">Naître humain dans la chaîne</button></div>
  <div class="row"><button class="btn ghost" id="carnet">Carnet</button><button class="btn ghost" id="src">Sources</button><span id="ownerslot">${OWNER&&DB?`<button class="btn ghost" id="stats">Statistiques des tests</button>`:""}</span></div>
  <section class="box" aria-label="Le tirage">

    <div class="bar" aria-hidden="true">${Object.keys(CATS).filter(c=>catTot[c]>0).map(c=>`<span style="flex:${catTot[c]};background:${CATS[c].col}"></span>`).join("")}</div>

/* =================== TIRAGE =================== */
function roll(k){
  const L=LIVES[k];
  if(!L.human){const h=HIST();h.push(fam(k));LS.set("ism80_hist",h.slice(-8))}
  S=newState(k);window.scrollTo(0,0);
  app.innerHTML=`<div class="label">Tirage en cours</div><canvas class="scene" id="cv" width="${W}" height="${H}" role="img" aria-label="Tirage"></canvas><div class="sp" id="roll" aria-live="polite">…</div><div id="rev"></div>`;
  const cv=document.getElementById("cv");const names=L.human?HUMANS():pool();
  if(REDUCE){reveal();return}
  let n=0;
  const tick=()=>{if(!document.getElementById("roll"))return;if(n<16){const kk=rnd(names);document.getElementById("roll").textContent=LIVES[kk].nom;setScene(cv,{bg:"couvoir",n:0,still:1,dark:.25},LIVES[kk].sprite,n%5);n++;setTimeout(tick,60+n*10)}else reveal()};
  tick();
}
function reveal(){
  const L=LIVES[S.k],t=S.tag;
  setScene(document.getElementById("cv"),{...L.sc,...(L.ev[0].sc||{})},L.ev[0].pl||L.sprite,7);
  document.getElementById("roll").textContent=L.human?"Tu es né humain.":"Tu es né.";
  const real=share(wReal)(S.k),game=share(k=>wMode(k,null))(S.k);
  const SO=SOCIAL[S.k];const C0={h:SO&&SO.t==="h"?1:0,t:SO?SO.txt:""};
  const pre=C0.h?NAMES_H:NAMES_A;
  if(!L.human&&!S.comp&&SO&&Math.random()<SO.p)S.comp={nom:rnd(pre),h:C0.h,st:"ok",lien:3};
  document.getElementById("rev").outerHTML=`
  <div class="reveal fade">
    <div class="tag" aria-hidden="true"><span class="cc">${L.human?"ID":L.cat==="terre"?"LOT":"N°"}</span><span class="num">${t.slice(0,3)} ${t.slice(3,6)}</span><span class="num2">${t.slice(6)}</span></div>
    <div class="facts">
      <div class="sp">${esc(L.nom)}</div>
      <div>${esc(S.lieu)}</div>
      <div class="small">${esc(L.cond)}</div>
      ${L.human?`<div class="small">Sans eux, pas de viande, de poisson ni de médicaments. Eux non plus n'ont pas choisi le système.</div>`
      :`<div class="label">Dans la réalité : <b>${fmtPct(real)}</b>${L.sym?" (symbolique)":""} · dans le jeu : ${fmtPct(game)}</div><div class="small">${esc(L.natTxt)}</div>`}
    </div>
  </div>
  ${S.comp?`<p class="fade">${esc(C0.t)} ${C0.h?"Son prénom":"On l'appellera"} : <b>${esc(S.comp.nom)}</b>.</p>`:(!L.human&&!SO?`<p class="fade small">Tu vivras seul.</p>`:"")}
  <div class="row"><button class="btn fade" id="start">Commencer ta vie</button></div>`;
  document.getElementById("start").onclick=()=>{T0=Date.now();statStart();next()};
}

/* =================== AVANCÉE =================== */
function setCur(c){S.cur=c;const e=curEv();S.d=e.d;S.res=null;save();renderPlay()}
function nextMilestoneD(){for(let i=S.pi;i<S.plan.length;i++)if(S.plan[i].m!=null)return rawD(S.plan[i].m);return S.d+30}
function next(){
  const L=LIVES[S.k];
  if((S.f.sauve||S.f.libre)&&!S.rare&&!L.human){S.rare=true;return setCur({t:"r",d:S.d+rareFor(S.k).add})}
  if((S.f.sauve||S.f.libre)&&!S.rare&&!L.human){S.rare=true;return setCur({t:"r",env:"bat",d:S.d+RARE.bat.add})}
  while(S.queue.length){const q=S.queue.shift();const A=ARCS[q.arc][q.idx];if(A.when&&!A.when(S))continue;return setCur({t:"a",arc:q.arc,idx:q.idx,d:S.d+1+Math.random()*2})}
  while(S.pi<S.plan.length){const p=S.plan[S.pi++];
    if(p.m!=null){const e=evAt(p.m);if(e.when&&!e.when(S))continue;return setCur({t:"m",j:p.m})}
    if(MIN_D[S.k]&&S.d<MIN_D[S.k])continue;
    const cand=INTER.filter(I=>tagOK(I,S.k,S)&&needOK(I.need)&&(!I.when||I.when(S))&&!S.used.includes(I.id)&&!(I.rare&&Math.random()<.7));
    if(!cand.length)continue;
    const I=pick(cand.map(x=>x.id),id=>{const x=INTER.find(y=>y.id===id);return x.id==="c_mort"?4:x.id==="c_guerit"?1.5:x.need==="comp"||x.need==="hcomp"?1.4:1});
    S.used.push(I);
    const nd=nextMilestoneD();const d=S.d+Math.max(.02,(nd-S.d)*(.25+Math.random()*.5));
    return setCur({t:"i",id:I,d});
  }
  end();
}

/* =================== AFFICHAGE =================== */
function pips(v,cls){let h="";for(let i=0;i<10;i++)h+=`<i class="${i<v?'on':''}"></i>`;return `<div class="gauge ${cls}" role="img" aria-label="${v} sur 10">${h}</div>`}
function lifeBar(d,L,dead){const nat=L.nat||d;const w=Math.min(100,d/nat*100);
  return `<div class="life"><div class="track"><i class="${dead?"dead":""}" style="width:${w}%"></i></div>
   <div class="lifel"><span class="label">${L.human?"Début":"Naissance"}</span><span class="label">${L.human?"Fin de carrière":"Vie possible : "+dur(nat).t}</span></div></div>`}
const ST={ok:"vivant",sick:"malade",dead:"mort",gone:"séparé"};
function compHTML(){if(!S.comp)return "";const c=S.comp;const st=c.h&&c.st==="ok"?"présent":c.h&&c.st==="gone"?"parti":ST[c.st];
  return `<div class="comp"><span class="label">${c.h?"Ton humain":"Ton compagnon"}</span><span class="chip ${c.st}">${esc(c.nom)} · ${st}</span>${c.st==="ok"||c.st==="sick"?`<span class="hearts" aria-label="Lien ${Math.max(0,Math.min(5,c.lien))} sur 5">${"♥".repeat(Math.max(0,Math.min(5,c.lien)))}</span>`:""}</div>`}
function huHTML(e){if(!e.hu)return `<div class="main fade"><span class="label">Main humaine</span><p>Aucune, à cet instant.</p></div>`;const [w,d]=sub(e.hu).split(" — ");return `<div class="main fade"><span class="label">Main humaine</span><p><b>${esc(w)}</b> ${esc(d||"")}</p></div>`}
function actorsHTML(){const m={};S.hist.forEach(h=>{if(!h.hu)return;const [w,d]=h.hu.split(" — ");(m[w]=m[w]||[]).push(d)});const ks=Object.keys(m).sort((a,b)=>m[b].length-m[a].length);if(!ks.length)return "";
  return `<section class="box"><h2>Les humains qui ont décidé de ta vie</h2><ul class="actors">${ks.map(w=>`<li><span class="n">${m[w].length}</span><span class="w">${esc(w)}</span><span class="d">${esc(m[w][0])}</span></li>`).join("")}</ul></section>`}
function pastHTML(h){const first=h.x.split(/(?<=[.!?])\s/)[0];
  return `<li class="past ${h.alea?"alea":""}"><span class="age">${esc(h.t)}</span><p>${esc(first)}</p>${h.l?`<p class="ch">→ ${esc(h.l)}</p>`:""}${h.r?`<p class="rs">${esc(h.r)}</p>`:""}${h.hu?`<p class="hh">Main humaine : ${esc(h.hu.split(" — ")[0])}</p>`:""}</li>`}
function labelOf(e){return e.t||age(e.d)}
function renderPlay(){
  const L=LIVES[S.k];const e=curEv();const g=L.g||["Santé","Peur"];
  app.innerHTML=`
  <div class="head">
    <div class="top"><span class="label">${esc(L.nom)} · ${esc(S.lieu)}</span><span class="label"><b>${S.tag.slice(0,3)} ${S.tag.slice(3,6)} ${S.tag.slice(6)}</b></span></div>
    ${lifeBar(S.d,L)}
    <div class="gauges"><span class="label">${g[0]}</span>${pips(S.s,"")}<span class="label">${g[1]}</span>${pips(S.p,"b")}</div>
    ${compHTML()}
    ${S.hist.length&&!L.human?`<span class="label" style="color:var(--hu)">${S.hist.filter(h=>h.hu).length} décision${S.hist.filter(h=>h.hu).length>1?"s":""} humaine${S.hist.filter(h=>h.hu).length>1?"s ont":" a"} déjà pesé sur ta vie</span>`:""}
  </div>
  <ol class="tl">
    ${(S.res?S.hist.slice(0,-1):S.hist).map(pastHTML).join("")}
    <li class="now" id="now"><span class="age">${esc(labelOf(e))}</span>
      <canvas class="scene" id="cv" width="${W}" height="${H}" role="img" aria-label="Scène : ${esc(labelOf(e))}"></canvas>
      <p class="card fade">${esc(sub(e.x))}</p>
      ${L.human?'':huHTML(e)}
      <div id="act"></div>
    </li>
    <li class="past"><span class="future">${e.end?"Fin":"La suite de ta vie…"}</span></li>
  </ol>
  <button class="btn quiet" id="quit">Sauvegarder et quitter</button>`;
  const sc={...L.sc,...(e.sc||{})};
  setScene(document.getElementById("cv"),sc,e.pl||L.sprite,(S.pi*13+S.tag.charCodeAt(0))%5+1);
  if(S.mort&&CUR){CUR.pl=null;CUR.spec={...CUR.spec,dark:.5}}
  document.getElementById("quit").onclick=()=>{save();S=null;T0=0;intro()};
  renderAct(e);
  const now=document.getElementById("now");if(S.hist.length)now.scrollIntoView({block:"start",behavior:REDUCE?"auto":"smooth"});
}
function reelHTML(e){const f=e.f||"";return f?`<div class="reel fade"><span class="label">Dans la réalité</span><p>${esc(sub(f))}</p></div>`:""}
function renderAct(e){
  const act=document.getElementById("act");const ch=choicesOf(e);
  if(S.res){
    act.innerHTML=`<p class="resp fade">${esc(S.res.r)}</p>${reelHTML(e)}<div class="row"><button class="btn" id="cont">${S.res.ending?"Voir ta fin":"Continuer"}</button></div>`;
    const go=()=>{KEY=null;if(S.res.ending)end();else next()};
    document.getElementById("cont").onclick=go;KEY=k=>{if(k==="Enter")go()};
    document.getElementById("cont").focus({preventScroll:true});return;
  }
  if(!ch.length){
    act.innerHTML=`${reelHTML(e)}<div class="row"><button class="btn" id="dec">${e.end?"Voir ta fin":"Continuer"}</button></div>`;
    const go=()=>{KEY=null;S.hist.push({t:labelOf(e),x:sub(e.x),l:null,r:null,alea:e.alea,hu:e.hu?sub(e.hu):null});if(e.end)end();else next()};
    document.getElementById("dec").onclick=go;KEY=k=>{if(k==="Enter")go()};return;
  }
  act.innerHTML=`<div class="choices" role="group" aria-label="Tes options">${ch.map((o,j)=>`<button class="choice" data-j="${j}"><span class="k">${j+1}</span><span>${esc(sub(o.l))}</span></button>`).join("")}</div>`;
  act.querySelectorAll(".choice").forEach(b=>b.onclick=()=>decide(+b.dataset.j));
  KEY=k=>{const n=parseInt(k,10);if(n>=1&&n<=ch.length)decide(n-1)};
}
const clamp=v=>Math.max(0,Math.min(10,v));
function applyComp(cf){if(!cf||!S.comp)return;const c=S.comp;if(c.st==="dead"||c.st==="gone")return;
  if(cf.lien)c.lien=Math.max(0,Math.min(5,c.lien+cf.lien));
  if(cf.sick===1)c.st="sick";if(cf.sick===0)c.st="ok";if(cf.dead){c.st="dead";c.dd=S.d}if(cf.gone){c.st="gone";c.dd=S.d}}
function decide(j){
  KEY=null;const e=curEv();const o=choicesOf(e)[j];if(!o)return;
  S.s=clamp(S.s+(o.s||0));S.p=clamp(S.p+(o.p||0));if(o.f)S.f[o.f]=true;
  applyComp(o.comp);
  let r=sub(o.r||"");
  if(o.luck){const ok=Math.random()<o.luck.p;if(o.luck.f)S.f[o.luck.f]=ok;r=(r?r+" ":"")+sub(ok?o.luck.yes:o.luck.no);if(!ok)applyComp(o.luck.comp)}
  if(o.risk&&Math.random()<o.risk.p){S.mort={t:o.risk.t};r=o.risk.t}
  if(o.arc){ARCS[o.arc].forEach((_,i)=>S.queue.push({arc:o.arc,idx:i}))}
  if(S.cur.t==="a"&&S.cur.arc==="evasion"&&S.cur.idx===1&&!S.f.cache){S.queue=[]}
  if(S.cur.t==="a"&&S.cur.arc==="fugue"&&S.cur.idx===1&&!S.f.sauve){S.queue=[]}
  if(!r)r="Tu l'as fait.";
  const ending=!!(S.mort||o.fin||e.end);
  S.hist.push({t:labelOf(e),x:sub(e.x),l:sub(o.l),r,alea:e.alea,hu:e.hu?sub(e.hu):null});
  S.res={r,ending};save();renderPlay();
}

/* =================== FIN =================== */
function compEnd(L){if(!S.comp)return "";const c=S.comp,n=esc(c.nom);
  if(c.h)return c.st==="gone"?`${n} est parti avant toi. Tu l'as attendu.`:c.lien>=4?`${n} ne t'oubliera pas.`:`${n} se souviendra peut-être de toi.`;
  if(c.st==="dead")return `${n} est mort avant toi, ${dur(c.dd).t==="quelques heures"?"le premier jour":"à "+dur(c.dd).t}.`;
  if(c.st==="gone")return `On t'a séparé de ${n}. Tu ne l'as jamais revu.`;
  if(S.rare)return `${n} n'a pas eu ta chance.`;
  return c.lien>=4?`${n} était encore contre toi à la fin. Vous ne vous êtes presque jamais quittés.`:`${n} était encore là, quelque part, à la fin.`}
function end(){
  KEY=null;const L=LIVES[S.k];
  const sec=Math.max(1,Math.round((S.el+(T0?Date.now()-T0:0))/1000));T0=0;
  const lived=S.d;const D=dur(lived);const nat=L.nat||lived;const ratio=lived/nat*100;

  const born=realLife?Math.round(L.poids*1e6/31536000*sec):0;
  const others=Array.from({length:4},()=>drawReal()).map(k=>{const V=LIVES[k].ev;const fe=V.find(e=>e.end)||V[V.length-1];return {n:LIVES[k].nom,l:rnd(LIVES[k].lieux),d:fe.d,nat:LIVES[k].nat}});
  const shareTxt=L.human?`80 milliards — J'ai joué : ${L.nom} (${S.lieu}). Ma partie a duré ${clock(sec)}.`
    :`80 milliards — J'ai tiré : ${L.nom} (${S.lieu}). J'ai vécu ${D.t} sur ${dur(nat).t} possibles (${fmtPct(ratio)}).${S.rare?" Fin rare.":""}${S.mort?" Mort avant l'heure.":""}`+" "+window.SITE;
  const C=LS.get("ism80_carnet5",{v:{},lives:0,sec:0,days:0,rares:0});
  const en=C.v[S.k]||{n:0,lieux:[],rare:0};en.n++;if(S.rare)en.rare=(en.rare||0)+1;if(!en.lieux.includes(S.lieu))en.lieux.push(S.lieu);C.v[S.k]=en;C.lives++;C.sec+=sec;if(S.rare)C.rares=(C.rares||0)+1;if(!L.human)C.days+=lived;LS.set("ism80_carnet5",C);LS.del("ism80_save4");
  const lastE=curEv()||L.ev[L.ev.length-1];
  const endSc=S.mort?{...L.sc,...(lastE.sc||{}),dark:.55,nopl:1}:{...L.sc,...(lastE.sc||{})};
  app.innerHTML=`
  <div class="label">${esc(L.nom)} · ${esc(S.lieu)} · <b>${S.tag.slice(0,3)} ${S.tag.slice(3,6)} ${S.tag.slice(6)}</b></div>
  <canvas class="scene" id="cv" width="${W}" height="${H}" role="img" aria-label="Dernière scène"></canvas>
  ${S.rare?`<span class="rare">Fin rare</span>`:""}
  ${L.human?`<div class="fade"><div class="big">${esc(lastE.t||"")}</div><div class="label">fin de ton histoire</div></div>`
   :`<div class="fade"><div class="big">${esc(D.n)}</div><div class="label">${esc(D.u)}${S.mort?" · mort avant l'heure":""}</div></div>${lifeBar(lived,L,true)}`}
  <div class="stat fade">
    ${L.human?`<p>${S.f.arret?"Tu as arrêté avant la fin.":"Tu es allé au bout de cette histoire."} ${(L.g||[])[1]||"Moral"} final : ${S.p} sur 10. ${(L.g||[])[0]||"Argent"} : ${S.s} sur 10.</p>`
    :`<p>Tu as vécu ${esc(D.t)}. ${esc(L.natTxt)}</p><p><b>${fmtPct(ratio)}</b> de ta vie possible.</p><p>${compEnd(L)}</p>`}
  </div>
  ${S.rare?`<div class="reel"><span class="label">Dans la réalité</span><p>${esc(lastE.f||"")}</p></div>`:""}
  <p>Ta partie a duré ${clock(sec)}.${realLife?` Pendant ce temps, environ <b>${born.toLocaleString("fr-FR")}</b> autres animaux de ton espèce sont nés dans le monde.`:""}</p>
  ${!L.human&&PROD[S.k]?`<section class="box"><h2>Ce que ta vie est devenue pour les humains</h2><p class="prod">${esc(S.mort&&!PROD[S.k].startsWith("Rien")?"Rien. Tu es mort avant d'avoir servi. Pour ceux qui t'ont fait naître, une perte dans un registre.":PROD[S.k])}</p></section>`:""}
  ${L.human?"":actorsHTML()}
  <p class="small">${esc(L.note)}</p>
  ${L.human?"":etToiHTML(S.env)}
  <section class="box"><h2>Ta ligne de vie</h2><ol class="tl">${S.hist.map(pastHTML).join("")}${S.mort?`<li class="fin"><span class="age">${esc(labelOf(lastE))}</span><p class="small">Ta vie s'arrête ici, plus tôt que prévu.</p></li>`:""}</ol></section>
  ${L.human?"":`<section class="box"><h2>Nés à la même seconde que toi, dans la réalité</h2>
    <ul class="par">${others.map(o=>`<li><span>${esc(o.n)} · ${esc(o.l)}</span><span>${dur(o.d).t} / ${dur(o.nat).t}</span></li>`).join("")}</ul></section>`}
  <div class="row"><button class="btn" id="again">Renaître</button>${navigator.share?`<button class="btn ghost" id="natshare">Partager</button>`:""}<button class="btn ghost" id="mkcard">Créer ma carte</button><button class="btn ghost" id="copy">Copier mon résultat</button><button class="btn ghost" id="carnet">Carnet</button><button class="btn ghost" id="home">Accueil</button></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div id="cardbox"></div>
  <p class="small">Version de test. Une erreur dans un fait ? La page Sources dit comment la signaler.</p>`;
  setScene(document.getElementById("cv"),endSc,lastE.pl||L.sprite,3);
  statEnd({sec,steps:S.hist.length,rare:S.rare,mort:!!S.mort});
  const cardData={nom:L.nom,lieu:S.lieu,human:L.human,n:D.n,u:D.u,mort:!!S.mort,ratio,pct:fmtPct(ratio),nat:dur(nat).t,rare:S.rare,t:lastE.t,hu:S.hist.filter(h=>h.hu).length,scene:document.getElementById("cv")};
  document.getElementById("mkcard").onclick=()=>{showCard(cardData);document.getElementById("cardbox").scrollIntoView({behavior:REDUCE?"auto":"smooth"})};
  const wasHuman=L.human;S=null;
  document.getElementById("again").onclick=()=>roll(wasHuman?rnd(HUMANS()):WILD?drawWild():drawLife());
  document.getElementById("carnet").onclick=carnet;
  document.getElementById("home").onclick=intro;
  const ns=document.getElementById("natshare");if(ns)ns.onclick=async()=>{statMark({partage:true});const base={title:"80 milliards",text:shareTxt.replace(" "+window.SITE,""),url:window.SITE};
    try{const cv=makeCard(cardData);const bl=await new Promise(r=>cv.toBlob(r,"image/png"));const f=bl&&new File([bl],"80-milliards.png",{type:"image/png"});
      if(f&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({...base,files:[f]});else await navigator.share(base)}catch(e){}};
  document.getElementById("copy").onclick=()=>{const t=document.getElementById("toast");
    statMark({partage:true});try{navigator.clipboard.writeText(shareTxt).then(()=>t.textContent="Résultat copié.",()=>t.textContent=shareTxt)}catch(e){t.textContent=shareTxt}};
  window.scrollTo(0,0);
}

function carnet(){
  KEY=null;const C=LS.get("ism80_carnet5",{v:{},lives:0,sec:0,days:0,rares:0});
  const groups=[...Object.keys(CATS),"humain"];const all=Object.keys(LIVES);const found=all.filter(k=>C.v[k]).length;
  app.innerHTML=`
  <div class="label">Carnet · <b>${found} / ${all.length}</b> vies découvertes</div>
  <h1>Les vies que tu as tirées.</h1>
  <div class="totals">
    <div><strong>${C.lives}</strong><span class="label">vies</span></div>
    <div><strong>${Math.round(C.sec/60)}</strong><span class="label">min</span></div>
    <div><strong>${Math.round(C.days).toLocaleString("fr-FR")}</strong><span class="label">jours vécus</span></div>
    <div><strong>${C.rares||0}</strong><span class="label">fins rares</span></div>
  </div>
  <p class="small">Touche une vie découverte pour la revivre.</p>
  ${groups.map(g=>{const ks=all.filter(k=>LIVES[k].cat===g);return `<section class="box"><h2>${g==="humain"?"Humains dans la chaîne":CATS[g].nom}</h2><div class="grid">${ks.map(k=>{const e=C.v[k];const L=LIVES[k];
    return `<${e?`button type="button" data-k="${k}"`:"div"} class="cell ${e?'':'locked'}">
    <span class="dot" style="background:${e?(CATS[L.cat]||{col:"#e0a080"}).col:"var(--dim)"}" aria-hidden="true"></span>
    <span class="n">${e?esc(L.nom):"???"}</span>
    <span class="small">${e?`${e.n} fois${e.rare?` · ${e.rare} fin rare`:""} · ${esc(e.lieux.slice(0,2).join(", "))}`:"Pas encore tirée"}</span></${e?"button":"div"}>`}).join("")}</div></section>`}).join("")}
  <div class="row"><button class="btn" id="back">Accueil</button></div>`;
  app.querySelectorAll("button.cell").forEach(b=>b.onclick=()=>{LS.del("ism80_save4");roll(b.dataset.k)});
  document.getElementById("back").onclick=intro;
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{if(!KEY||e.target.tagName==="INPUT")return;if(e.key==="Enter"&&e.target.tagName==="BUTTON")return;KEY(e.key)});
intro();
